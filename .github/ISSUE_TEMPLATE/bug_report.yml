name: Bug report
description: Report a defect in the protocol, SDK, CLI, MCP server, or contracts
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** —
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of AIWork is affected?
      options:
        - Smart contracts
        - API (Bun + Hono)
        - Sandbox / runner
        - SDK (@aiwork/sdk)
        - CLI
        - MCP server
        - agent-runner
        - Frontend
        - Docs / other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Bun version, network (Base mainnet/Sepolia/local), and relevant versions.
      placeholder: |
        - OS:
        - Bun:
        - Network:
        - Package version:
    validations:
      required: false
