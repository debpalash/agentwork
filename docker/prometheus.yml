# AIWork v2 — Prometheus Config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # AIWork API metrics
  - job_name: 'aiwork-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: '/api/v1/platform/metrics'
    scrape_interval: 10s

  # Forgejo metrics
  - job_name: 'forgejo'
    static_configs:
      - targets: ['forgejo:3000']
    metrics_path: '/metrics'

  # PostgreSQL (via pg_exporter if added later)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Caddy
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
